    <text x="96" y="178">Docker CLI</text>
    <text x="452" y="65">DockSlate WSL 2</text>
    <text x="452" y="126" fill="#79b1ff">Docker Engine · Moby</text>
  </g>
  <g fill="#a0afbf" font-family="Segoe UI,Malgun Gothic,sans-serif" font-size="14">
    <text x="96" y="91">Windows</text>
    <text x="96" y="202">Compose · Buildx</text>
    <text x="452" y="160">컨테이너 · 이미지 · 볼륨 · 네트워크</text>
    <text x="452" y="198">앱 제거 시 엔진 데이터를 자동 삭제하지 않음</text>
  </g>
</svg>
