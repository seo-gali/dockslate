name: Package verified desktop installer once

on:
  push:
    branches: [main]
    paths: [.github/workflows/license-installer.yml]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore reviewed binaries and locked tooling
        run: |
          $release = Get-Content -Raw package.json | ConvertFrom-Json
          $portable = Join-Path 'downloads' ('DockSlate-' + $release.version + '-windows-x64.zip')
          if ((Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash -cne 'B2F15BCB3EED05CFDE51090DE41F331FF3F3D0C3D6AA7B67A63EE939921CDFF5') { throw 'Portable input differs from its verified receipt.' }
          Expand-Archive -LiteralPath $portable -DestinationPath '.analysis/reviewed-binaries'
          $source = (Join-Path '.analysis/reviewed-binaries' ('DockSlate-' + $release.version + '-windows-x64'))
          $build = Get-Content -Raw docs/results/installer-engine-integration.json | ConvertFrom-Json
          New-Item -ItemType Directory -Path 'src-tauri/target/release' -Force | Out-Null
          foreach ($item in @(@{source='DockSlate.exe';name='dockslate.exe'},@{source='bin/docker.exe';name='docker.exe'})) {
            $file = Join-Path $source $item.source
            $record = @($build.artifacts | Where-Object name -CEQ $item.name)
            if ($record.Count -ne 1 -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -cne $record[0].sha256) { throw 'Reviewed application or launcher hash differs.' }
            Copy-Item -LiteralPath $file -Destination (Join-Path 'src-tauri/target/release' $item.name)
          }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare official components and verify notices
        run: |
          & ./scripts/prepare-windows-docker.ps1 -AllowDownload
          node scripts/verify-license-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PATH preservation and build installer
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./scripts/verify-installer-path.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/build-installer.ps1 -SkipBuild -AllowToolDownload
      - name: Record installer checksum
        run: |
          $directory = 'src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $directory -Filter '*_x64-setup.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -eq 0) { throw 'Exactly one x64 installer is required.' }
          $checksum = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash
          [IO.File]::WriteAllText((Join-Path $directory 'SHA256SUMS.txt'), ($checksum + '  ' + $installers[0].Name + "`n"))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DockSlate-verified-desktop-installer
          path: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
