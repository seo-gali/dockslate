name: Upload verified 0.1.13 release draft once

on:
  push:
    tags: [v0.1.13]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact tag, version and release bytes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const report=JSON.parse(fs.readFileSync('docs/results/release-0.1.13.json'));
          assert.equal(process.env.GITHUB_REF_NAME,'v0.1.13');
          assert.equal(JSON.parse(fs.readFileSync('package.json')).version,report.version);
          assert.equal(report.version,'0.1.13');assert.equal(report.files.length,3);
          assert.equal(report.signing.status,'NotSigned');assert.equal(report.published,false);
          for(const file of report.files){
            assert(/^(DockSlate_0\.1\.13_x64-setup\.exe|DockSlate-0\.1\.13-(windows-x64|third-party-licenses)\.zip)$/.test(file.file));
            const bytes=fs.readFileSync('downloads/'+file.file);assert.equal(bytes.length,file.bytes);
            assert.equal(createHash('sha256').update(bytes).digest('hex').toUpperCase(),file.sha256);
          }
          assert.equal(fs.readFileSync('downloads/SHA256SUMS.txt','utf8'),report.files.map(f=>f.sha256+'  '+f.file).join('\n')+'\n');
          NODE
      - name: Upload draft and verify all uploaded files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            downloads/DockSlate_0.1.13_x64-setup.exe \
            downloads/DockSlate-0.1.13-windows-x64.zip \
            downloads/DockSlate-0.1.13-third-party-licenses.zip \
            downloads/SHA256SUMS.txt \
            --verify-tag --draft --prerelease --title "DockSlate 0.1.13" \
            --notes-file docs/releases/v0.1.13.md
          gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" > .release013-draft.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';import {execFileSync} from 'node:child_process';
          const report=JSON.parse(fs.readFileSync('docs/results/release-0.1.13.json'));
          const release=JSON.parse(fs.readFileSync('.release013-draft.json'));
          const hash=b=>createHash('sha256').update(b).digest('hex').toUpperCase();
          assert(release.draft&&release.prerelease&&release.tag_name==='v0.1.13');
          const sums=fs.readFileSync('downloads/SHA256SUMS.txt');
          const files=[...report.files,{file:'SHA256SUMS.txt',bytes:sums.length,sha256:hash(sums)}];
          assert.equal(release.assets.length,4);const verified=[];
          for(const file of files){
            const asset=release.assets.find(a=>a.name===file.file);assert(asset);assert.equal(asset.size,file.bytes);
            assert.equal(asset.digest,'sha256:'+file.sha256.toLowerCase());
            const bytes=execFileSync('gh',['api','repos/'+process.env.GH_REPO+'/releases/assets/'+asset.id,'-H','Accept: application/octet-stream'],{maxBuffer:100*1024*1024});
            assert.equal(bytes.length,file.bytes);assert.equal(hash(bytes),file.sha256);
            verified.push({...file,assetId:asset.id,githubDigestMatches:true,downloadedBytesVerified:true});
          }
          fs.writeFileSync('release013-upload-receipt.json',JSON.stringify({version:'0.1.13',observedAt:new Date().toISOString(),tag:release.tag_name,sourceCommit:process.env.GITHUB_SHA,url:release.html_url,releaseId:release.id,draft:true,published:false,prerelease:true,assets:verified},null,2)+'\n');
          console.log(JSON.stringify({draft:true,filesVerified:verified.length,releaseId:release.id}));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DockSlate-0.1.13-upload-receipt
          path: release013-upload-receipt.json
          if-no-files-found: error
          retention-days: 3
