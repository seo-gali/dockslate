name: Publish scanned 0.1.13 release once

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize013-release.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify scans and exact assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const base='https://api.github.com/repos/seo-gali/dockslate',tag='v0.1.13';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'};
          const api=async(path,method='GET',body)=>{const response=await fetch(base+path,{method,headers,body:body?JSON.stringify(body):undefined});if(!response.ok)throw Error(method+' '+path+' HTTP '+response.status);return response.status===204?null:response.json();};
          const hash=b=>createHash('sha256').update(b).digest('hex').toUpperCase();
          const report=JSON.parse(fs.readFileSync('docs/results/release-0.1.13.json'));
          const scans=JSON.parse(fs.readFileSync('docs/results/virustotal-0.1.13.json'));
          assert.equal(report.version,'0.1.13');assert.equal(report.files.length,3);assert.equal(scans.version,report.version);assert.equal(scans.files.length,4);
          for(const scan of scans.files)assert(scan.completed&&scan.detections===0&&scan.totalEngines>0);
          for(const artifact of report.artifacts)assert(scans.files.some(s=>s.sha256===artifact.sha256));
          const sums=fs.readFileSync('downloads/SHA256SUMS.txt');
          assert.equal(sums.toString(),report.files.map(f=>f.sha256+'  '+f.file).join('\n')+'\n');
          const files=[...report.files,{file:'SHA256SUMS.txt',bytes:sums.length,sha256:hash(sums)}];
          for(const file of files){assert(/^(DockSlate_0\.1\.13_x64-setup\.exe|DockSlate-0\.1\.13-(windows-x64|third-party-licenses)\.zip|SHA256SUMS\.txt)$/.test(file.file));const b=fs.readFileSync('downloads/'+file.file);assert.equal(b.length,file.bytes);assert.equal(hash(b),file.sha256);if(file.file.endsWith('.exe')||file.file.includes('windows-x64'))assert(scans.files.some(s=>s.sha256===file.sha256));}
          let ref=(await api('/git/ref/tags/'+tag)).object;if(ref.type==='tag')ref=(await api('/git/tags/'+ref.sha)).object;
          assert.equal(ref.type,'commit');assert.equal(ref.sha,'7844ec0eff90c8b58c6021dfdd91901d177f38e8');
          const releases=await api('/releases?per_page=100');let release=releases.find(r=>r.tag_name===tag);
          console.log(JSON.stringify({existingReleaseFound:!!release,draft:release?.draft,assets:release?.assets?.map(a=>({name:a.name,bytes:a.size,digest:a.digest}))}));
          if(!release)release=await api('/releases','POST',{tag_name:tag,name:'DockSlate 0.1.13',draft:true,prerelease:true,body:fs.readFileSync('docs/releases/v0.1.13.md','utf8')});
          assert(release.prerelease);assert(release.assets.every(a=>files.some(f=>f.file===a.name)));
          for(const file of files){let asset=release.assets.find(a=>a.name===file.file);if(!asset){assert(release.draft,'Public release must already contain all verified assets');const url=new URL(release.upload_url.split('{')[0]);assert.equal(url.hostname,'uploads.github.com');assert(url.pathname.startsWith('/repos/seo-gali/dockslate/'));url.searchParams.set('name',file.file);const response=await fetch(url,{method:'POST',headers:{...headers,'Content-Type':'application/octet-stream'},body:fs.readFileSync('downloads/'+file.file)});assert(response.ok);asset=await response.json();}assert.equal(asset.size,file.bytes);assert.equal(asset.digest,'sha256:'+file.sha256.toLowerCase());}
          if(release.draft)await api('/releases/'+release.id,'PATCH',{draft:false,prerelease:true,name:'DockSlate 0.1.13',body:fs.readFileSync('docs/releases/v0.1.13.md','utf8')});
          release=await api('/releases/'+release.id);
          assert(!release.draft&&release.prerelease&&release.tag_name===tag);const verified=[];
          for(const file of files){const asset=release.assets.find(a=>a.name===file.file);assert(asset);assert.equal(asset.digest,'sha256:'+file.sha256.toLowerCase());const url='https://github.com/seo-gali/dockslate/releases/download/'+tag+'/'+file.file;assert.equal(asset.browser_download_url,url);const response=await fetch(url);assert(response.ok);const bytes=Buffer.from(await response.arrayBuffer());assert.equal(bytes.length,file.bytes);assert.equal(hash(bytes),file.sha256);verified.push({...file,assetId:asset.id,githubDigestMatches:true,publicBytesVerified:true,url});}
          fs.writeFileSync('release013-upload-receipt.json',JSON.stringify({version:'0.1.13',observedAt:new Date().toISOString(),tag:release.tag_name,sourceCommit:ref.sha,url:release.html_url,releaseId:release.id,draft:false,published:true,prerelease:true,assets:verified},null,2)+'\n');console.log(JSON.stringify({published:true,filesVerified:verified.length,releaseId:release.id}));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DockSlate-0.1.13-upload-receipt
          path: release013-upload-receipt.json
          if-no-files-found: error
          retention-days: 3
