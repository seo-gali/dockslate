name: Package 0.1.12 installer once

on:
  push:
    branches: [main]
    paths: [.github/workflows/release012-installer.yml]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore verified application and launcher
        run: |
          $payload = '.github/release012-installer-input.zip'
          if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash -cne '4CDB61E327CFCBC9E3DFFBA582A6C5AB0E03DBB3A170DF39A0F78A066CF9639D') { throw 'Installer input ZIP differs from its verified receipt.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = @{
            'dockslate.exe' = @{path='src-tauri/target/release/dockslate.exe'; sha256='3B2FEB8A2D9D741BF68D0244D8EFDF0E5F91C1242F9EEF186A368BD9F950C094'; bytes=5352960}
            'docker.exe' = @{path='src-tauri/target/release/docker.exe'; sha256='2B97539DDDEDF395FA3262F5F7A985FF0F1096222D1319DAEC659B8881D354AD'; bytes=320000}
            'docs/USER_GUIDE.md' = @{path='docs/USER_GUIDE.md'; sha256='81B1E4ABC5833FC0D18837611B8497B61E93849C440AAFC8D51C518BF6E905EA'; bytes=10090}
            'docs/MIGRATION.md' = @{path='docs/MIGRATION.md'; sha256='5C71DED8CD8A084976F28AB3A0CABEB52512C267E6E82F26DF16916FF6752EDD'; bytes=4871}
            'docs/REQUEST_STATUS.md' = @{path='docs/REQUEST_STATUS.md'; sha256='D4380DA8C8E7C3BF88F5F41934229CA39BB8008C41EE247D024B0EF7B6B3415A'; bytes=23684}
            'docs/results/code-signing.md' = @{path='docs/results/code-signing.md'; sha256='7316AE4C9C2CD27D068E4F72C6164067E6C10EA3689886717C5DCED0035F6B3B'; bytes=9518}
            'docs/results/security-review-20261119.md' = @{path='docs/results/security-review-20261119.md'; sha256='A4244B91947BD2BA0A62E50AAEF3B1F96F474695753B61728A12CD3FBCC182B1'; bytes=13911}
          }
          $archive = [IO.Compression.ZipFile]::OpenRead($payload)
          try {
            if ($archive.Entries.Count -ne $expected.Count) { throw 'Unexpected input entry count.' }
            foreach ($name in $expected.Keys) {
              $entries = @($archive.Entries | Where-Object FullName -CEQ $name)
              $record = $expected[$name]
              if ($entries.Count -ne 1 -or $entries[0].Length -ne $record.bytes) { throw 'Unexpected input layout or size.' }
              $output = $record.path
              New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($output)) -Force | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0],$output,$true)
              if ((Get-FileHash -LiteralPath $output).Hash -cne $record.sha256) { throw 'Input hash differs.' }
            }
          } finally { $archive.Dispose() }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare components and verify notices
        run: |
          & ./scripts/prepare-windows-docker.ps1 -AllowDownload
          node scripts/verify-license-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact installer sources
        run: |
          function TextHash([string]$file) {
            $text = [IO.File]::ReadAllText($file).Replace("`r`n","`n")
            $sha = [Security.Cryptography.SHA256]::Create()
            try { [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($text))).Replace('-','') } finally { $sha.Dispose() }
          }
          if ((TextHash 'src-tauri/installer/hooks.nsh') -cne '7AFB73CEFF2D966723DC64F1E2CDB7B64D33B758EF498CFC26A853BE2506950D') { throw 'Installer hook changed.' }
          if ((TextHash 'src-tauri/installer/user-path.ps1') -cne 'CF9FFF99A588D4E850A35CE829966B1A05B6E6542C9D461068A055A7010C83E1') { throw 'PATH helper changed.' }
      - name: Verify PATH handling and package installer
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./scripts/verify-installer-path.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/build-installer.ps1 -SkipBuild -AllowToolDownload
      - name: Record installer receipt
        run: |
          $path = 'src-tauri/target/release/bundle/nsis/DockSlate_0.1.12_x64-setup.exe'
          if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Expected installer missing.' }
          [IO.File]::WriteAllText('src-tauri/target/release/bundle/nsis/SHA256SUMS.txt',((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash + '  DockSlate_0.1.12_x64-setup.exe' + "`n"))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DockSlate-0.1.12-installer
          path: |
            src-tauri/target/release/bundle/nsis/DockSlate_0.1.12_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
