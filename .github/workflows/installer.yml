name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [build/installer]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare approved official Docker components
        run: |
          & ./scripts/prepare-windows-docker.ps1 -AllowDownload
      - name: Build the application and installer
        run: |
          & ./scripts/build-installer.ps1 -AllowToolDownload
      - name: Verify installer output
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = 'src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $directory -Filter '*_x64-setup.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -eq 0) { throw 'Exactly one nonempty x64 installer is required.' }
          $checksum = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash
          [IO.File]::WriteAllText((Join-Path $directory 'SHA256SUMS.txt'), ($checksum + '  ' + $installers[0].Name + "`n"))
          Write-Output ($installers[0].Name + ' ' + $checksum)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DockSlate-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
