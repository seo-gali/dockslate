name: Publish approved DockSlate 0.1.16 once

on:
  push:
    branches: [main]
    paths:
      - .github/release016-publish-input.json

permissions:
  contents: read

concurrency:
  group: publish-dockslate-016
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'seo-gali/dockslate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node .github/publish016-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
