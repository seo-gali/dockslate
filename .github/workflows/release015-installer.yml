name: Package 0.1.15 installer once

on:
  push:
    branches: [main]
    paths: [.github/workflows/release015-installer.yml]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore verified application and launcher
        run: |
          $payload = '.github/release015-installer-input.zip'
          if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash -cne 'FFB9B16288B306B7F05865EE13C62DC313B6FDF433EF4E1B2B25C91F6EAD8D21') { throw 'Installer input ZIP differs from its verified receipt.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = @{
            'dockslate.exe' = @{path='src-tauri/target/release/dockslate.exe'; sha256='19B8E47588FF3164ED3C1CC95E42788BF365FDCC0E0E3E1AF26E6CD2339AEAE0'; bytes=5298688}
            'docker.exe' = @{path='src-tauri/target/release/docker.exe'; sha256='3EB9CBCC658312CC721FC1C31498FDD0A12FBC8D976A95D52539E4F035E4069D'; bytes=320512}
            'docs/USER_GUIDE.md' = @{path='docs/USER_GUIDE.md'; sha256='9FB261EA06D84AF99D88E6BE2D5CF920F1F928EE1D1E60693F77A0186549F6DD'; bytes=12619}
            'docs/MIGRATION.md' = @{path='docs/MIGRATION.md'; sha256='AE51BC47342AF6B98544C50C2736275107A5018F58BB91C3C26807075768BAF2'; bytes=11819}
            'docs/REQUEST_STATUS.md' = @{path='docs/REQUEST_STATUS.md'; sha256='6843A34EF4BAC3B8C6BD7BE9697B91FAFCD829889E796AB80082428B0B9A165B'; bytes=30058}
            'docs/results/code-signing.md' = @{path='docs/results/code-signing.md'; sha256='CF5DDA06FD2EE4DF9B9384CB02F393CC63B183DA3083E42395EB3B676FD638D7'; bytes=9806}
            'docs/results/security-review-20261119.md' = @{path='docs/results/security-review-20261119.md'; sha256='45DD1EBE4978695AE71264A074B644D3CFD8321ECFB89ED1FDBA47873F93B293'; bytes=14098}
            'site/guide.html' = @{path='site/guide.html'; sha256='540A8908844D6AAD10D2AB9E7C6CC305D5E4274E9E6AB26E156DAA797FA42CFB'; bytes=7279}
          }
          $archive = [IO.Compression.ZipFile]::OpenRead($payload)
          try {
            if ($archive.Entries.Count -ne $expected.Count) { throw 'Unexpected input entry count.' }
            foreach ($name in $expected.Keys) {
              $entries = @($archive.Entries | Where-Object FullName -CEQ $name)
              $record = $expected[$name]
              if ($entries.Count -ne 1 -or $entries[0].Length -ne $record.bytes) { throw 'Unexpected input layout or size.' }
              $output = $record.path
              New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($output)) -Force | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0],$output,$true)
              if ((Get-FileHash -LiteralPath $output).Hash -cne $record.sha256) { throw 'Input hash differs.' }
            }
          } finally { $archive.Dispose() }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare components and verify notices
        run: |
          & ./scripts/prepare-windows-docker.ps1 -AllowDownload
          node scripts/verify-license-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact installer sources
        run: |
          function TextHash([string]$file) {
            $text = [IO.File]::ReadAllText($file).Replace("`r`n","`n")
            $sha = [Security.Cryptography.SHA256]::Create()
            try { [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($text))).Replace('-','') } finally { $sha.Dispose() }
          }
          if ((TextHash 'src-tauri/installer/hooks.nsh') -cne 'CF5B884F52C57B4DB36D46868A6758C79A7A8E9D9FCDBCEC1E3175EBF0F58808') { throw 'Installer hook changed.' }
          if ((TextHash 'src-tauri/installer/user-path.ps1') -cne '222F59DC272F9FCC753D40016C4CE6308020B39FC469BB0F7991CE9D433206D5') { throw 'PATH helper changed.' }
      - name: Verify PATH handling and package installer
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./scripts/verify-installer-path.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/build-installer.ps1 -SkipBuild -AllowToolDownload
      - name: Record installer receipt
        run: |
          $path = 'src-tauri/target/release/bundle/nsis/DockSlate_0.1.15_x64-setup.exe'
          if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Expected installer missing.' }
          [IO.File]::WriteAllText('src-tauri/target/release/bundle/nsis/SHA256SUMS.txt',((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash + '  DockSlate_0.1.15_x64-setup.exe' + "`n"))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: DockSlate-0.1.15-installer
          path: |
            src-tauri/target/release/bundle/nsis/DockSlate_0.1.15_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
