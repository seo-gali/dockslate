name: Package DockSlate 0.1.7 installer once

on:
  push:
    branches: [main]
    paths: [.github/workflows/release017-installer.yml]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore verified application and launcher
        run: |
          $payload = '.github/release017-installer-input.zip'
          if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash -cne 'B113C21C5D2CD438FB7FC535B5EEBC3744980127EA8B88756A258EA3427784C2') { throw 'Installer input ZIP differs from its verified receipt.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($payload)
          try {
            if ($archive.Entries.Count -ne 2) { throw 'Exactly two reviewed executable entries required.' }
            $build = Get-Content -Raw docs/results/installer-engine-integration.json | ConvertFrom-Json
            New-Item -ItemType Directory -Path 'src-tauri/target/release' -Force | Out-Null
            foreach ($name in @('dockslate.exe','docker.exe')) {
              $entries = @($archive.Entries | Where-Object FullName -CEQ $name)
              $record = @($build.artifacts | Where-Object name -CEQ $name)
              if ($entries.Count -ne 1 -or $record.Count -ne 1) { throw 'Unexpected installer input layout.' }
              $output = Join-Path 'src-tauri/target/release' $name
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0],$output,$false)
              if ((Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash -cne $record[0].sha256) { throw 'Reviewed executable hash differs.' }
            }
          } finally { $archive.Dispose() }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare components and verify notices
        run: |
          & ./scripts/prepare-windows-docker.ps1 -AllowDownload
          node scripts/verify-license-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PATH handling and package installer
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./scripts/verify-installer-path.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/build-installer.ps1 -SkipBuild -AllowToolDownload
      - name: Record installer receipt
        run: |
          $path = 'src-tauri/target/release/bundle/nsis/DockSlate_0.1.7_x64-setup.exe'
          if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Expected installer missing.' }
          [IO.File]::WriteAllText('src-tauri/target/release/bundle/nsis/SHA256SUMS.txt',((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash + '  DockSlate_0.1.7_x64-setup.exe' + "`n"))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DockSlate-0.1.7-installer
          path: |
            src-tauri/target/release/bundle/nsis/DockSlate_0.1.7_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
