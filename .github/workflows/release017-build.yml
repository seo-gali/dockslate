name: Build 0.1.17 delivery once

on:
  push:
    branches: [main]
    paths: [.github/workflows/release017-build.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and verify fresh delivery
        shell: pwsh
        run: ./.github/release017-build.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: DockSlate-0.1.17-delivery
          path: |
            downloads/DockSlate_0.1.17_x64-setup.exe
            downloads/DockSlate-0.1.17-windows-x64.zip
            downloads/DockSlate-0.1.17-third-party-licenses.zip
            downloads/SHA256SUMS.txt
            docs/results/installer-engine-integration.json
          if-no-files-found: error
          retention-days: 3
