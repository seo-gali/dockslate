name: Register comment review issue once

on:
  push:
    branches: [main]
    paths:
      - .github/comment-review-issue.json

permissions:
  contents: read

concurrency:
  group: comment-review-issue-20261124
  cancel-in-progress: false

jobs:
  issue:
    if: github.repository == 'seo-gali/dockslate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node .github/comment-review-issue.mjs
        env:
          GH_TOKEN: ${{ github.token }}
