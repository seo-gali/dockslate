name: Package 0.1.14 installer once

on:
  push:
    branches: [main]
    paths: [.github/workflows/release014-installer.yml]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore verified application and launcher
        run: |
          $payload = '.github/release014-installer-input.zip'
          if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash -cne '006A57E311FA4696685C8B8F6174407D9F2CBAB29AD375E2B5ECFCD08CAC81EE') { throw 'Installer input ZIP differs from its verified receipt.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = @{
            'dockslate.exe' = @{path='src-tauri/target/release/dockslate.exe'; sha256='93F1AC024656D70B2AACB656A99E3E3D110BB03F9CD4CD1D47346ABAA7636351'; bytes=5423104}
            'docker.exe' = @{path='src-tauri/target/release/docker.exe'; sha256='63BFAECB498889545A1D6D8B3FECD12FB8FF02937A64948336126A14941983CB'; bytes=320512}
            'docs/USER_GUIDE.md' = @{path='docs/USER_GUIDE.md'; sha256='7E0F82F1F18C558E4AD36DD7A040ACE82DE99B42019C034222A280E02A8EEFAE'; bytes=10997}
            'docs/MIGRATION.md' = @{path='docs/MIGRATION.md'; sha256='202A58782D62CBECF20E8E496CACD8DBF21C151267BA19B55DED64307279C29B'; bytes=10140}
            'docs/REQUEST_STATUS.md' = @{path='docs/REQUEST_STATUS.md'; sha256='8645BD454C64122FFF52682D9FDEC157D55F8482D2B816258C566D2CE5DA5682'; bytes=28040}
            'docs/results/code-signing.md' = @{path='docs/results/code-signing.md'; sha256='CF5DDA06FD2EE4DF9B9384CB02F393CC63B183DA3083E42395EB3B676FD638D7'; bytes=9806}
            'docs/results/security-review-20261119.md' = @{path='docs/results/security-review-20261119.md'; sha256='45DD1EBE4978695AE71264A074B644D3CFD8321ECFB89ED1FDBA47873F93B293'; bytes=14098}
          }
          $archive = [IO.Compression.ZipFile]::OpenRead($payload)
          try {
            if ($archive.Entries.Count -ne $expected.Count) { throw 'Unexpected input entry count.' }
            foreach ($name in $expected.Keys) {
              $entries = @($archive.Entries | Where-Object FullName -CEQ $name)
              $record = $expected[$name]
              if ($entries.Count -ne 1 -or $entries[0].Length -ne $record.bytes) { throw 'Unexpected input layout or size.' }
              $output = $record.path
              New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($output)) -Force | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0],$output,$true)
              if ((Get-FileHash -LiteralPath $output).Hash -cne $record.sha256) { throw 'Input hash differs.' }
            }
          } finally { $archive.Dispose() }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare components and verify notices
        run: |
          & ./scripts/prepare-windows-docker.ps1 -AllowDownload
          node scripts/verify-license-inventory.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact installer sources
        run: |
          function TextHash([string]$file) {
            $text = [IO.File]::ReadAllText($file).Replace("`r`n","`n")
            $sha = [Security.Cryptography.SHA256]::Create()
            try { [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($text))).Replace('-','') } finally { $sha.Dispose() }
          }
          if ((TextHash 'src-tauri/installer/hooks.nsh') -cne '7AFB73CEFF2D966723DC64F1E2CDB7B64D33B758EF498CFC26A853BE2506950D') { throw 'Installer hook changed.' }
          if ((TextHash 'src-tauri/installer/user-path.ps1') -cne 'CF9FFF99A588D4E850A35CE829966B1A05B6E6542C9D461068A055A7010C83E1') { throw 'PATH helper changed.' }
      - name: Verify PATH handling and package installer
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -File ./scripts/verify-installer-path.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/build-installer.ps1 -SkipBuild -AllowToolDownload
      - name: Record installer receipt
        run: |
          $path = 'src-tauri/target/release/bundle/nsis/DockSlate_0.1.14_x64-setup.exe'
          if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Expected installer missing.' }
          [IO.File]::WriteAllText('src-tauri/target/release/bundle/nsis/SHA256SUMS.txt',((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash + '  DockSlate_0.1.14_x64-setup.exe' + "`n"))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DockSlate-0.1.14-installer
          path: |
            src-tauri/target/release/bundle/nsis/DockSlate_0.1.14_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
