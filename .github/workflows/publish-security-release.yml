name: Publish verified security release once

on:
  push:
    tags: [v0.1.10]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify exact files, inspection and approved unsigned publication
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const r=read('docs/results/security-release-0.1.10.json');
          assert.equal(process.env.GITHUB_REF_NAME,'v0.1.10');
          assert.equal(read('package.json').version,r.version);
          assert.equal(r.version,'0.1.10');
          assert.equal(r.signing.status,'NotSigned');
          assert.equal(r.signing.unsignedPublicationApproved,true);
          assert.equal(r.checks.package.installerInspected,true);
          assert.equal(r.checks.package.embeddedInstallerHelperMatches,true);
          assert.equal(r.checks.package.zipFilesVerified,434);
          assert.equal(r.checks.nativeEngine.checks.length,18);
          assert(r.checks.nativeEngine.checks.every(c=>c.passed));
          assert.equal(r.checks.nativeEngine.existingEngineStatePreserved,true);
          assert.equal(r.files.length,3);
          for(const file of r.files){
            assert(/^(DockSlate_0\.1\.10_x64-setup\.exe|DockSlate-0\.1\.10-(windows-x64|third-party-licenses)\.zip)$/.test(file.file));
            const bytes=fs.readFileSync('downloads/'+file.file);
            assert.equal(bytes.length,file.bytes);
            assert.equal(createHash('sha256').update(bytes).digest('hex').toUpperCase(),file.sha256);
            if(file.file.includes('third-party-licenses'))continue;
            const scan=r.virusTotal.files.find(s=>s.file===file.file);
            assert(scan?.completed&&scan.detections===0&&scan.totalEngines>0);
            assert.equal(scan.sha256.toUpperCase(),file.sha256);
          }
          for(const name of ['DockSlate.exe','bin/docker.exe']){
            const scan=r.virusTotal.files.find(s=>s.file===name);
            assert(scan?.completed&&scan.detections===0&&scan.totalEngines>0);
          }
          assert.equal(fs.readFileSync('downloads/SHA256SUMS.txt','utf8').replaceAll('\r\n','\n'),r.files.map(f=>f.sha256+'  '+f.file).join('\n')+'\n');
          assert(fs.readFileSync('docs/releases/v0.1.10.md','utf8').includes('미서명'));
          NODE
      - name: Publish approved prerelease with exact checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            downloads/DockSlate_0.1.10_x64-setup.exe \
            downloads/DockSlate-0.1.10-windows-x64.zip \
            downloads/DockSlate-0.1.10-third-party-licenses.zip \
            downloads/SHA256SUMS.txt \
            --verify-tag --prerelease --title "DockSlate 0.1.10" \
            --notes-file docs/releases/v0.1.10.md
