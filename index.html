<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <title>DockSlate</title>
    <style>
      .file-start{max-width:700px;margin:12vh auto;padding:32px;font:16px/1.7 "Segoe UI",sans-serif;color:#202b3d;background:#fff;border:1px solid #dbe2ed;border-radius:16px;box-shadow:0 12px 40px #13233b0a}.file-start h1{margin:0 0 12px;font-size:30px}.file-start p{margin:12px 0}.file-start a{display:inline-block;margin-top:8px;padding:10px 20px;border-radius:8px;background:#2455dc;color:white;text-decoration:none}.file-start small{display:block;margin-top:20px;color:#58677a}body:has(.file-start){margin:20px;background:#f5f7fb}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="file-start">
        <h1>DockSlate</h1>
        <p>컨테이너 관리는 Windows 앱에서 실행합니다.</p>
        <p>이 HTML은 앱의 화면 소스입니다. 아래 안내에서 EXE를 내려받거나 사용 방법을 확인하세요.</p>
        <a href="./guide.html">실행 파일 · 사용 안내 열기</a>
        <small>개발 중이라면 <code>npm run dev</code>로 화면을 열거나 <code>scripts/desktop.ps1 -Mode dev</code>로 데스크톱 앱을 실행하세요.</small>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
