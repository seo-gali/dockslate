name: dockslate-node-example
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dockslate-node-example:local
    init: true
    environment:
      NODE_ENV: production
      PORT: "8080"
      APP_NAME: DockSlate Node.js example
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
